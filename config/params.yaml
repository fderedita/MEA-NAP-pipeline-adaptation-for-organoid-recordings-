# =============================================================================
# organoid-mea-foundation — frozen parameters
#
# Single source of truth for every threshold/band/window used anywhere in
# src/. Code must fail loudly (raise, not default) if a parameter it needs is
# missing here. Values marked TODO are not yet determined and MUST be set
# (with justification recorded in the relevant stage report) before the code
# path that uses them is run for real. Values without TODO are given
# explicitly in the project handoff (docs/handoff_foundation_phase.md) and are
# frozen as-is unless a later checkpoint overrides them explicitly.
# =============================================================================

reproducibility:
  random_seed: 42

paths:
  raw_data_dir: data/raw
  manifests_dir: outputs/manifests
  features_dir: outputs/features
  figures_dir: outputs/figures
  reports_dir: outputs/reports

dandi:
  dandisets:
    - id: "001603"
      role: ground_truth_anchor
      platform: MaxWell_MaxOne
    - id: "001872"
      role: independent_cortical_replicate
      platform: MaxWell_MaxTwo
  # TODO: confirm whether authenticated DANDI API access is needed/available
  # once NIH-review banner status is checked (Stage 0 / Stage 0.5).

# ---------------------------------------------------------------------------
# Stage 1: preprocessing + pipeline validation against deposited ground truth
# ---------------------------------------------------------------------------
preprocessing:
  bandpass_hz: [300, 6000]          # spike-band filter, per handoff Task 1.2
  reference: common_median          # common median reference (CMR)
  # ElectricalSeries is stored under nwbfile.acquisition (not .processing) in
  # both dandisets, and NeuroConv's own convention is to place raw/wideband
  # data there -- treated as wideband raw. NOT independently confirmed via a
  # PSD check against a known filter cutoff; flagged as an assumption in
  # stage1_validation.md, not a settled fact.
  assume_wideband_raw: true

spike_detection:
  # STAGE 1 CLOSED 2026-07-10 (human decision, see outputs/reports/stage1_validation.md
  # "Closing decision"). Four methods tried (threshold, wavelet, uncurated
  # lupin sorter, curated lupin sorter) -- none met the acceptance criteria
  # below on per-electrode rate/burst correlation. The 2026-07-13 addendum to
  # that report found this is quantitatively explained by raw/deposited-Units
  # session gap (HO1/HO4 ~57min apart -> higher rho; HO2/HO3 ~4 days apart ->
  # lower rho), not method quality -- i.e. deposited Units and any self-
  # derived method are measuring the SAME underlying activity at DIFFERENT
  # points in time, which no method can reconcile.
  #
  # PIVOT 2026-07-13 (human decision): given that finding, mixing deposited
  # Units (SUA, curated, from a DIFFERENT session) with self-derived spikes
  # (MUA or curated SUA) for different recordings/datasets introduces a
  # bigger, unlabelled confound than using ONE uniform detection method
  # everywhere. Frozen policy for Stage 2 (do not re-litigate per recording):
  #   - Default for ANY recording with raw available (001603 HO1-HO4,
  #     all of 001872): MEA-NAP threshold detection (`mea_nap_threshold`
  #     below) -- same method, same code path, same params, across both
  #     datasets and both platforms (MaxOne/MaxTwo). This is MUA-level, not
  #     SUA -- population/aggregate features are the primary intended use;
  #     do not over-interpret per-electrode unit identity.
  #   - Exception, forced by data availability, not choice: 001603's
  #     "sourced" subjects (HO5-HO8) have NO raw file deposited on DANDI at
  #     all -- MEA-NAP cannot run. These 4 rows keep `spike_source:
  #     deposited` as the only option that exists, documented explicitly as
  #     an exception, not silently mixed in.
  #   - The prior policy (deposited-where-available, curated `lupin`
  #     sorting elsewhere) is preserved as `feature_matrix_001603_deposited_
  #     only.parquet` / `feature_matrix_001872.parquet` (self-derived-sorter
  #     run, kept for comparison, not deleted) -- see outputs/features/.
  #   - Every Stage 2 feature row must carry a `spike_source` field
  #     (`deposited` | `mea_nap_threshold` | `self_derived_lupin_curated`)
  #     -- never mixed silently.
  method: mea_nap_threshold  # {deposited, mea_nap_threshold, self_derived_lupin_curated} -- selected per recording, see above
  sorter_name: lupin                  # spikeinterface CPU sorter (fastest + most units in feasibility testing) -- kept for the self_derived_lupin_curated comparison run
  curation:
    # Matches the deposited ground truth's own curation criteria exactly
    # (per the HO1 notebook exploration's file metadata), so self-derived
    # and deposited features are curated the same way.
    snr_min: 5.0
    isi_violation_max: 0.3
    firing_rate_min_hz: 0.05
  # Superseded by self_derived_lupin_curated above; kept only as a record of
  # what was tried during Stage 1 (see stage1_validation.md for all 4 results).
  threshold_mad_multiplier: 4       # MEA-NAP's "thr4" convention (median - 4*MAD/0.6745), tried and rejected
  ref_period_ms: 2.0                # MEA-NAP Params.ref_period default
  wavelet:                          # tried and rejected (slightly worse than threshold)
    name: bior1.5
    wid_ms: [0.4, 0.8]
    n_scales: 5
    cost_factor: -0.12
    option: l

validation:
  # Stage 1 acceptance criteria (handoff Task 1.4) -- NOT met by any method
  # tried; Stage 1 closed anyway by human decision 2026-07-10, see
  # outputs/reports/stage1_validation.md. Left here as the historical record
  # of the original bar, not as an active gate for Stage 2.
  min_firing_rate_spearman_rho: 0.8
  max_network_burst_rate_pct_diff: 15
  # Network burst rate for both self-derived and deposited sides is computed
  # via MEA-NAP's own Bakkum ISI_N network-burst detector
  # (meanap.pipeline.firing_rates.firing_rates_bursts), using its defaults
  # (min_spike_network_burst=10, min_channel_network_burst=3, automatic
  # ISI_N threshold) -- not yet exposed as separate config keys since Stage 2
  # hasn't formally adopted MEA-NAP's burst detector, only this validation has.

# ---------------------------------------------------------------------------
# Stage 2: feature extraction battery — identical params across both datasets
# ---------------------------------------------------------------------------
active_electrode_criterion:
  # TODO: finalize from Stage 0 Task 0.4 settings audit (MaxOne vs MaxTwo may
  # differ; must reconcile or flag features as platform-sensitive).
  min_firing_rate_hz: null

burst_detection:
  # PIVOT 2026-07-13 (human decision, part of the "unicamente MEA-NAP"
  # policy -- see spike_detection above): per-unit/per-channel burst
  # detection now uses MEA-NAP's own single_channel_burst_detection()
  # (meanap.pipeline.burst_detection), the Bakkum ISI_N method -- the same
  # algorithm already used for network-level bursts in features/network.py
  # (meanap.pipeline.firing_rates.firing_rates_bursts). One burst-detection
  # method everywhere, not two different ones for channel vs. network level.
  method: meanap_isi_n              # {max_interval, meanap_isi_n} -- meanap_isi_n is the active default
  # MEA-NAP's own defaults (meanap.params.Params.single_channel_burst_min_spike
  # / single_channel_isi_threshold), reused directly rather than re-deriving.
  meanap_isi_n:
    min_spikes: 5
    isi_threshold: automatic         # "automatic" (MEA-NAP's adaptive threshold) or a fixed float in seconds
  # Superseded by meanap_isi_n above; kept only as a record of the original
  # handoff-specified method (Task 4.1) and for _detect_bursts_max_interval's
  # continued presence in spike_train.py as an available-but-unused function.
  # Widely-cited defaults for the classic Max Interval burst detector
  # (NeuroExplorer/Axion convention; see Cotterill & Eglen 2019, "Burst
  # Detection Methods", Front. Comput. Neurosci. for a review citing these
  # as standard) -- not empirically tuned on our data, flagged as a
  # literature default like MEA-NAP's own thr4/FOOOF conventions elsewhere
  # in this file.
  max_isi_start_ms: 100             # ISI <= this may start a burst
  max_isi_end_ms: 200               # burst continues while ISI <= this (looser than start, allows brief gaps)
  min_spikes_per_burst: 5
  min_burst_duration_ms: 50

network:
  # MEA-NAP's own defaults (meanap.params.Params), reused directly rather
  # than re-deriving -- already validated against MATLAB for the
  # deterministic parts (STTC itself); the probabilistic thresholding is
  # inherently stochastic in both MATLAB and this port (see
  # meanap.pipeline.probabilistic_threshold's own docstring).
  sttc_lag_ms: [10, 15, 25]         # multiple lags, per MEA-NAP convention (func_con_lag_val)
  surrogate_control:
    method: circular_shift          # meanap.pipeline.probabilistic_threshold.circular_shift_spikes
    n_surrogates: 200               # MEA-NAP's prob_thresh_rep_num default
    tail: 0.05                      # MEA-NAP's prob_thresh_tail default (one-sided upper-tail significance)

spectral:
  # SCOPE NOTE (2026-07-13, human decision): spectral/aperiodic features are
  # NOT part of MEA-NAP (verified against Sit et al. 2024, Cell Reports
  # Methods -- no spectral/FOOOF/aperiodic content in that paper). Under the
  # "unicamente MEA-NAP" Stage 2 policy (see spike_detection above), this
  # block is computed and saved to the feature matrix (real scientific
  # value, explicitly requested by the handoff as a maturation/E-I proxy)
  # but is SUPPLEMENTARY, not part of the primary MEA-NAP-native feature set
  # that feeds Stage 3-5 by default. Keep computing; don't feed to Stage 3-5
  # without an explicit, separate decision to include it.
  #
  # 300Hz lowpass -> 1000Hz downsample target leaves a healthy margin below
  # the new Nyquist (500Hz), standard convention for organoid/cortical LFP
  # (activity of interest is well under 100Hz; 300Hz cutoff avoids
  # aliasing artifacts without over-attenuating the transition band).
  lfp_lowpass_hz: 300
  lfp_target_fs_hz: 1000            # LFP downsample target, per handoff 4.3
  psd_method: welch
  fooof:
    # [1,100]Hz is FOOOF's own commonly-cited example fitting range
    # (Donoghue et al. 2020) -- avoids the 1/f-dominated near-0Hz region and
    # stays well below our LFP Nyquist (500Hz). aperiodic_mode='fixed' is
    # FOOOF's package default (no spectral "knee"); simpler starting choice,
    # not fit-checked against our data for a knee.
    freq_range_hz: [1, 100]
    aperiodic_mode: fixed           # {fixed, knee}

complexity:
  # SCOPE NOTE (2026-07-13, human decision): same status as spectral above
  # -- complexity/criticality features (avalanches, branching ratio,
  # entropy, Lempel-Ziv) are NOT part of MEA-NAP either (verified, no such
  # content in Sit et al. 2024). Computed and saved, but SUPPLEMENTARY, not
  # in the primary MEA-NAP-native set that feeds Stage 3-5 by default.
  #
  # Avalanche bin width: adaptive (mean inter-event interval of the pooled
  # population spike train), NOT a fixed ms value -- this is the standard
  # convention since Beggs & Plenz 2003 and used across the great majority
  # of avalanche/criticality literature, specifically because a fixed bin
  # size doesn't generalize across recordings with very different activity
  # levels (our own 001603 recordings already span ~0.4-1.3Hz mean firing
  # rate). Computed per-recording, not a config scalar.
  avalanche_bin_method: mean_iei
  avalanche_min_size: 1             # minimum total spike count for a bin-run to count as an avalanche
  # powerlaw package's own standard method: estimate xmin by minimizing
  # Kolmogorov-Smirnov distance between data and fitted power law (Clauset,
  # Shalizi & Newman 2009), rather than us picking a fixed cutoff.
  powerlaw_xmin_method: auto
  # Classic Beggs & Plenz branching ratio: for every pair of consecutive
  # non-empty bins (ancestor, descendant) within an avalanche, the ratio of
  # descendant to ancestor activity, averaged across all such pairs.
  branching_ratio_method: ratio_of_consecutive_bins
  entropy:
    # Richman & Moorman 2000's own standard defaults for sample entropy:
    # embedding dimension m=2, tolerance r=0.2 x signal std.
    sample_entropy_m: 2
    sample_entropy_r: 0.2
  lempel_ziv:
    # Binarize the population-rate signal by a median split (equal-weight
    # 0/1 partition) -- standard, assumption-light convention for LZ
    # complexity on continuous physiological signals.
    binarization_method: median_split

# ---------------------------------------------------------------------------
# Stage 3-5: batch effect, harmonization, reference signature
# ---------------------------------------------------------------------------
batch_effect:
  div_bin_width_days: null          # TODO: DIV binning for PERMANOVA / LMM
  permanova_n_permutations: 999

harmonization:
  method: combat
  batch_variable: dataset
  covariates: [DIV]

cross_validation:
  scheme: GroupKFold
  group: organoid_id
  n_folds: 5                        # TODO: revisit once distinct-organoid counts known (Stage 0)
